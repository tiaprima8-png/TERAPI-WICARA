name: Build & Save AbiBicara Pro APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Save to GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Debug Keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Copy APK to releases/ folder in repository
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/AbiBicara-Pro.apk
          ls -lh releases/AbiBicara-Pro.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AbiBicara-Pro-APK
          path: releases/AbiBicara-Pro.apk
          if-no-files-found: error

      - name: Commit & Push APK to releases/ folder
        if: github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add releases/AbiBicara-Pro.apk
          git diff --staged --quiet || git commit -m "chore(release): update AbiBicara-Pro.apk [skip ci]"
          git push

      - name: Create or Update GitHub Release with APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "AbiBicara Pro v1.0.${{ github.run_number }} (Siap Install)"
          body: |
            ### AbiBicara Pro - Pediatric Speech & Oral-Motor Trainer
            Unduh file **`AbiBicara-Pro.apk`** di bawah ini untuk langsung menginstal aplikasi di HP Android Anda.
          files: releases/AbiBicara-Pro.apk
          draft: false
          prerelease: false
